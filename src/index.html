<head>

  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#152235">
  <meta name="description" content="매크로에서 산업, 비즈니스 모델에서 기업으로. 11개 섹터를 연결해서 공부하는 나만의 산업 아카이브.">
  <title>Industry Archive</title>
  <!--@FAVICON-->
  <!--@STYLES-->
</head>
<body>
  <a class="skip-link" href="#main">본문으로 건너뛰기</a>
  <header class="topbar">
    <button class="menu-button icon-button" id="menu-toggle" aria-label="탐색 메뉴 열기" aria-expanded="false">☰</button>
    <a href="#/overview" class="brand"><span class="brand-mark" aria-hidden="true"><i></i><i></i><i></i></span><strong>Industry Archive</strong><span class="brand-divider"></span><span class="brand-sub">MARKET MONITOR · 03</span></a>
    <div class="topbar-right"><span class="edition">PERSONAL RESEARCH · VOL. 03</span><button class="icon-button" id="theme-toggle" aria-label="다크 모드로 전환" title="화면 테마 전환">◐</button><button class="icon-button" id="help-button" aria-label="사용 안내" title="사용 안내">?</button></div>
  </header>
  <div class="app-layout">
    <aside class="sidebar" id="sidebar" aria-label="산업 아카이브 탐색">
      <div class="sidebar-title"><span class="archive-icon" aria-hidden="true">▤</span><div><strong>산업 아카이브</strong><small>나의 투자를 위한 지식의 연결</small></div></div>
      <button class="search-trigger" id="search-open"><span>⌕</span><span>산업 · 기업 · 개념 검색</span><kbd>/</kbd></button>
      <nav id="navigation" aria-label="주 탐색"></nav>
      <div class="sidebar-footer"><span class="local-dot"></span>내 브라우저에 학습 기록 저장<small>다른 기기로 이동할 땐 서재에서 내보내기</small></div>
    </aside>
    <button class="sidebar-shade" id="sidebar-shade" aria-label="탐색 메뉴 닫기" hidden></button>
    <main id="main" tabindex="-1"></main>
  </div>
  <dialog id="search-dialog" class="search-dialog" aria-labelledby="search-title">
    <div class="search-dialog-head"><label for="global-search" id="search-title">⌕</label><input id="global-search" type="search" placeholder="섹터, 세부 산업, 기업명, 티커, 용어 검색" autocomplete="off"><button class="icon-button" data-close-dialog aria-label="검색 닫기">×</button></div>

  </dialog>
  <dialog id="info-dialog" aria-labelledby="info-title"><div id="info-content"></div></dialog>
  <input id="import-input" type="file" accept="application/json,.json" hidden>
  <div id="toast" class="toast" role="status" aria-live="polite"></div>
  <noscript><p class="noscript">이 산업 아카이브는 JavaScript가 필요합니다. 브라우저에서 JavaScript를 허용한 후 다시 열어주세요.</p></noscript>
